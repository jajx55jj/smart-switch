<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0b0f19" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Base Card -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bgGlow)" stroke="#334155" stroke-width="6" />
  
  <!-- Subtle Glass Highlight -->
  <rect x="30" y="30" width="452" height="230" rx="94" fill="white" opacity="0.03" />

  <!-- Outer Ring with Glow -->
  <circle cx="256" cy="266" r="140" fill="none" stroke="#22c55e" stroke-width="6" opacity="0.3" filter="url(#glow)" />
  <circle cx="256" cy="266" r="120" fill="#131d2e" stroke="#22c55e" stroke-width="4" opacity="0.8" />

  <!-- Power Icon -->
  <g filter="url(#glow)">
    <path d="M 256 160 A 90 90 0 1 1 210 178" fill="none" stroke="url(#primaryGrad)" stroke-width="22" stroke-linecap="round" />
    <line x1="256" y1="130" x2="256" y2="230" stroke="url(#primaryGrad)" stroke-width="22" stroke-linecap="round" />
  </g>
</svg>
